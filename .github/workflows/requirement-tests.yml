name: Requirement tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  requirements:
    name: Verify the requirement register against the artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # No LFS: the only two LFS objects are the full-assembly and
        # subassembly-100 STEP files, and nothing here reads STEP geometry.
        # The tests read part names, the manifest, the harness, the device
        # tree overlay and the MJCF, all of which are plain git objects.
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check pytest==9.1.1 pyyaml==6.0.3

      - name: Run requirement tests
        # --junitxml writes the per-test record. Without it the only thing a
        # reader outside this repository can learn from a run is whether the
        # whole job went green, which reads a skipped test as a passing one.
        #
        # junit_family=xunit1 rather than the xunit2 default: xunit2
        # filters the `file` attribute off every <testcase>, leaving only a
        # dotted classname. A reader outside this repository would then have
        # to turn `tests.requirements.test_wiring` back into a path to say
        # which test a result belongs to, and that guess is wrong the first
        # time a directory has a dot in it.
        run: >-
          python3 -m pytest tests/requirements -v
          --junitxml=junit.xml -o junit_family=xunit1

      - name: Upload the test report
        # always(): a red run's report is the one worth reading. Skipping the
        # upload on failure would publish per-test detail only for the runs
        # where every test already passed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: junit.xml
          if-no-files-found: error
